<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1015;
        --card: #171a22;
        --card-hover: #1c2029;
        --border: #2a2e3a;
        --text: #e6e8ee;
        --muted: #8a90a2;
        --green: #3ba776;
        --red: #d05a52;
        --radius: 10px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .page {
        height: 100vh;
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 28px;
        display: flex;
        flex-direction: column;
      }
      header {
        flex: 0 0 auto;
        margin-bottom: 18px;
      }
      .title-row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin: 0;
        letter-spacing: 0.3px;
        text-transform: uppercase;
      }
      .meta {
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .progress {
        margin-top: 14px;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .count {
        font-size: 14px;
        white-space: nowrap;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .count b {
        font-size: 20px;
        color: var(--text);
      }
      .count b.green {
        color: var(--green);
      }
      .count b.red {
        color: var(--red);
      }
      .bar {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: var(--border);
        overflow: hidden;
        min-width: 160px;
      }
      .bar-fill {
        height: 100%;
        width: 0;
        background: var(--green);
        transition: width 0.4s ease;
      }
      #grid {
        flex: 1 1 auto;
        min-height: 0;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(5, 1fr);
        gap: 12px;
      }
      .card {
        position: relative;
        min-height: 0;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px 20px 16px 22px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition:
          background 0.2s ease,
          border-color 0.3s ease;
      }
      .card:hover {
        background: var(--card-hover);
      }
      /* Полоса статуса слева */
      .card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--green);
        transition: background 0.3s ease;
      }
      .card.red::before {
        background: var(--red);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        flex: 0 0 auto;
        background: var(--muted);
        transition: background 0.3s ease;
      }
      .dot.green {
        background: var(--green);
      }
      .dot.red {
        background: var(--red);
      }
      .name {
        font-weight: 600;
        font-size: 16px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.2px;
      }
      .status-label {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--muted);
      }
      .card.green .status-label {
        color: var(--green);
      }
      .card.red .status-label {
        color: var(--red);
      }
      .error {
        margin-top: 8px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
        word-break: break-word;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="title-row">
          <h1>Health Dashboard</h1>
          <span class="meta" id="meta"></span>
        </div>
        <div class="progress">
          <span class="count" id="count"></span>
          <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        </div>
      </header>
      <div id="grid"></div>
    </div>

    <script>
      const grid = document.getElementById("grid");
      const meta = document.getElementById("meta");
      const count = document.getElementById("count");
      const barFill = document.getElementById("barFill");

      async function poll() {
        try {
          const response = await fetch("/api/checks");
          const checks = await response.json();
          render(checks);
          updateProgress(checks);
          meta.textContent = "обновлено " + new Date().toLocaleTimeString();
        } catch (error) {
          meta.textContent = "нет связи с бэкендом: " + error.message;
        }
      }

      function updateProgress(checks) {
        const greenCount = checks.filter(
          (check) => check.status === "green",
        ).length;
        const total = checks.length;
        const allGreen = greenCount === total;
        count.innerHTML = `<b class="${allGreen ? "green" : "red"}">${greenCount}</b> / ${total} проверок в норме`;
        barFill.style.width = total ? `${(greenCount / total) * 100}%` : "0";
        barFill.style.background = allGreen
          ? "var(--green)"
          : "var(--red)";
      }

      function render(checks) {
        grid.innerHTML = checks
          .map(
            (check) => `
          <div class="card ${check.status}">
            <div class="row">
              <span class="dot ${check.status}"></span>
              <span class="name">${check.name}</span>
              <span class="status-label">${check.status === "green" ? "OK" : "FAIL"}</span>
            </div>
            ${check.error ? `<div class="error">${escapeHtml(check.error)}</div>` : ""}
          </div>`,
          )
          .join("");
      }

      function escapeHtml(value) {
        return String(value).replace(
          /[&<>"]/g,
          (character) =>
            ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[
              character
            ],
        );
      }

      poll();
      setInterval(poll, 3000); // автообновление раз в 3 секунды
    </script>
  </body>
</html>
